# Release: on a v* tag, build the player package from this commit with the pinned toolchain (zig 0.15.2, MinHook
# 8af6b4a; tools/fetch-deps.sh checks both), then publish dist/b4bcoop-<version>.zip + SHA256SUMS as a GitHub release
# with a signed build provenance attestation. The tag must be v<version> from VERSION. The release body = notes from
# tools/relnotes.py (commits since the previous v* tag) + the provenance/checksum text.
# Verify a download: gh attestation verify b4bcoop-<version>.zip -R actuallydan/b4b-coop
# The in-game updater (#34) needs the zip, b4bcoop-update.txt and SHA256SUMS signed with the release key (ed25519,
# secret B4B_RELEASE_SIGNING_KEY; public key docs/release-signing.pub.pem, built into the agent): tools/sign-release.sh.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # OIDC token for the Sigstore signing certificate (attestation)
      attestations: write  # store the attestation
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history + tags: the release notes cover <previous v* tag>..<this tag>

      - name: Generate the release notes (tools/relnotes.py, CLAUDE.md "Commit messages")
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tools/relnotes.py "$TAG" > relnotes.md
          cat relnotes.md

      - name: Fetch the pinned toolchain (zig 0.15.2 + MinHook)
        run: tools/fetch-deps.sh --build

      - name: Check the tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(sed -n 's/^version=//p' VERSION)
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG but VERSION says $v"; exit 1; }
          echo "PKG_ZIP=b4bcoop-$v.zip" >> "$GITHUB_ENV"

      - name: Build the player package (native/build.sh --release)
        run: launch/package.sh

      - name: Check the player zip layout and that its DLLs have no dev code
        run: |
          # the zip mirrors the game folder (docs/investigations/launch.md)
          want="Gobi/Binaries/Win64/X3DAudio1_7.dll Gobi/Binaries/Win64/b4bcoop.ini b4bcoop-COMMANDS.txt b4bcoop-LICENSE.txt b4bcoop-README.txt xinput1_3.dll"
          zip="dist/b4bcoop-$(sed -n 's/^version=//p' VERSION).zip"   # named after VERSION
          got=$(unzip -Z1 "$zip" | grep -v '/$' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')
          [ "$got" = "$want" ] || { echo "::error::unexpected zip contents: $got"; exit 1; }
          dlls="dist/b4bcoop/Gobi/Binaries/Win64/X3DAudio1_7.dll dist/b4bcoop/xinput1_3.dll"
          for dll in $dlls; do
            for s in "server: listening" "exec failed" "rewardtest" "steamjoin" "Dev_JoinPool" "b4bcoop_protocol_override" "B4B_LAUNCHER_UPDATE" "update_pubkey"; do
              if grep -qaF -- "$s" "$dll"; then echo "::error::player build $dll contains dev string '$s'"; exit 1; fi
            done
          done
          grep -qaF "b4bcoop loaded (player build)" dist/b4bcoop/Gobi/Binaries/Win64/X3DAudio1_7.dll
          grep -qaF "CreateProcessW" dist/b4bcoop/xinput1_3.dll   # the launch redirect, not a plain proxy
          grep -qaF "auto-update-1" dist/b4bcoop/xinput1_3.dll    # the launcher updates b4bcoop before the game starts
          od -An -tx1 -v dist/b4bcoop/xinput1_3.dll | tr -d ' \n' |
            grep -q "$(tools/sign-release.sh pubhex docs/release-signing.pub.pem)" ||
            { echo "::error::the launcher does not carry docs/release-signing.pub.pem (native/src/signkeys.h)"; exit 1; }
          cat dist/SHA256SUMS

      - name: Build the mod maker's kit (modkit/package.sh; sources only, a separate zip)
        run: |
          if [ -x modkit/package.sh ]; then
            modkit/package.sh
            (cd dist/modkit && sha256sum b4bcoop-modkit-*.zip) >> dist/SHA256SUMS
            echo "KIT_ZIP=dist/modkit/$(cd dist/modkit && ls b4bcoop-modkit-*.zip)" >> "$GITHUB_ENV"
          fi

      - name: Sign the zip, the update manifest and SHA256SUMS with the release key (in-game updater, #34; after the kit adds its line)
        env:
          SIGNING_KEY: ${{ secrets.B4B_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::secret B4B_RELEASE_SIGNING_KEY is not set (docs/investigations/updater.md)"; exit 1; }
          key="$RUNNER_TEMP/release-signing.key"
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          tools/sign-release.sh sign "$key" "dist/$PKG_ZIP" dist/b4bcoop-update.txt dist/SHA256SUMS
          rm -f "$key"
          # the secret must match the public key the agent has built in
          tools/sign-release.sh verify docs/release-signing.pub.pem "dist/$PKG_ZIP" dist/b4bcoop-update.txt dist/SHA256SUMS
          grep -q "^zip=$PKG_ZIP$" dist/b4bcoop-update.txt
          cat dist/b4bcoop-update.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/${{ env.PKG_ZIP }}
            ${{ env.KIT_ZIP }}
            dist/b4bcoop/Gobi/Binaries/Win64/X3DAudio1_7.dll
            dist/b4bcoop/xinput1_3.dll

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          { cat relnotes.md; printf '\n---\n\n'; } > notes.md
          cat >> notes.md <<EOF
          Built by GitHub Actions from commit ${GITHUB_SHA} (tag ${TAG}), workflow \`.github/workflows/release.yml\`.

          Check your download:
          - \`sha256sum -c --ignore-missing SHA256SUMS\` next to the zip (Windows: \`Get-FileHash ${PKG_ZIP}\`, compare with the line below)
          - \`gh attestation verify ${PKG_ZIP} -R ${REPO}\` proves it was built by this repository's workflow.
          - \`${PKG_ZIP}.sig\`, \`SHA256SUMS.sig\` and \`b4bcoop-update.txt.sig\` are ed25519 signatures by the b4bcoop release key
            (\`docs/release-signing.pub.pem\`; the in-game updater checks them): \`tools/sign-release.sh verify docs/release-signing.pub.pem ${PKG_ZIP}\`

          \`\`\`
          $(cat dist/SHA256SUMS)
          \`\`\`
          EOF
          gh release create "$TAG" "dist/$PKG_ZIP" "dist/$PKG_ZIP.sig" dist/b4bcoop-update.txt dist/b4bcoop-update.txt.sig \
            ${KIT_ZIP:+"$KIT_ZIP"} dist/SHA256SUMS dist/SHA256SUMS.sig --repo "$REPO" --verify-tag \
            --title "b4b-coop $TAG" --notes-file notes.md
