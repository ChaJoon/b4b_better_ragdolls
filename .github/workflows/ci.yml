# CI: build the dev and player DLLs with the pinned toolchain on every push and pull request, and check that the player
# build carries no dev code; check new commit messages (tools/relnotes.py --check). Releases are built by release.yml.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    # Commit-message convention (CLAUDE.md "Commit messages"): subjects become the public release notes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check new commit subjects and Release-note trailers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else   # new branch or force push: what it adds on top of main
            range="origin/main..$AFTER"
          fi
          tools/relnotes.py --check "$range"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pinned toolchain (zig 0.15.2 + MinHook)
        run: tools/fetch-deps.sh --build

      - name: Unit tests (add-on pak checks; updater signature, hash, zip, manifest; native/test/run.sh)
        run: native/test/run.sh

      - name: Dev build
        run: native/build.sh

      - name: Player package (native/build.sh --release)
        run: launch/package.sh

      - name: Check the player zip layout and that its DLLs have no dev code
        run: |
          # the zip mirrors the game folder (docs/investigations/launch.md)
          want="Gobi/Binaries/Win64/X3DAudio1_7.dll Gobi/Binaries/Win64/b4bcoop.ini b4bcoop-COMMANDS.txt b4bcoop-LICENSE.txt b4bcoop-README.txt xinput1_3.dll"
          zip="dist/b4bcoop-$(sed -n 's/^version=//p' VERSION).zip"   # named after VERSION
          got=$(unzip -Z1 "$zip" | grep -v '/$' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')
          [ "$got" = "$want" ] || { echo "::error::unexpected zip contents: $got"; exit 1; }
          dlls="dist/b4bcoop/Gobi/Binaries/Win64/X3DAudio1_7.dll dist/b4bcoop/xinput1_3.dll"
          for dll in $dlls; do
            for s in "server: listening" "exec failed" "rewardtest" "steamjoin" "Dev_JoinPool" "b4bcoop_protocol_override" "B4B_LAUNCHER_UPDATE" "update_pubkey"; do
              if grep -qaF -- "$s" "$dll"; then echo "::error::player build $dll contains dev string '$s'"; exit 1; fi
            done
          done
          grep -qaF "b4bcoop loaded (player build)" dist/b4bcoop/Gobi/Binaries/Win64/X3DAudio1_7.dll
          grep -qaF "CreateProcessW" dist/b4bcoop/xinput1_3.dll   # the launch redirect, not a plain proxy
          grep -qaF "auto-update-1" dist/b4bcoop/xinput1_3.dll    # the launcher updates b4bcoop before the game starts
          od -An -tx1 -v dist/b4bcoop/xinput1_3.dll | tr -d ' \n' |
            grep -q "$(tools/sign-release.sh pubhex docs/release-signing.pub.pem)" ||
            { echo "::error::the launcher does not carry docs/release-signing.pub.pem (native/src/signkeys.h)"; exit 1; }
          # and the dev build still has them (so the check above means something)
          grep -qaF "server: listening" native/out/X3DAudio1_7.dll
          grep -qaF "server: listening" native/out/dwmapi.dll
          grep -qaF "B4B_LAUNCHER_UPDATE" native/out/xinput1_3.dll
          ls -l native/out/*.dll $dlls
          cat dist/SHA256SUMS
          # the in-game updater: the manifest release.yml signs, and the agent carries the committed release public key
          grep -q "^zip=b4bcoop-$(sed -n 's/^version=//p' VERSION).zip$" dist/b4bcoop-update.txt
          od -An -tx1 -v dist/b4bcoop/Gobi/Binaries/Win64/X3DAudio1_7.dll | tr -d ' \n' |
            grep -q "$(tools/sign-release.sh pubhex docs/release-signing.pub.pem)" ||
            { echo "::error::the player DLL does not carry docs/release-signing.pub.pem (native/src/signkeys.h)"; exit 1; }
          # and the add-on shop's own key (Browse tab catalog)
          od -An -tx1 -v dist/b4bcoop/Gobi/Binaries/Win64/X3DAudio1_7.dll | tr -d ' \n' |
            grep -q "$(tools/sign-release.sh pubhex docs/shop-signing.pub.pem)" ||
            { echo "::error::the player DLL does not carry docs/shop-signing.pub.pem (native/src/signkeys.h)"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: b4bcoop-${{ github.sha }}
          path: |
            dist/b4bcoop-*.zip
            dist/SHA256SUMS
          retention-days: 14
